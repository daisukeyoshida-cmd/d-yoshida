<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS自動売上計上 RPA実行サマリ</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Meiryo', 'Yu Gothic', sans-serif; background: #f0f2f5; color: #333; font-size: 14px; }
header { background: #2e4057; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
header span.sub { font-size: 13px; font-weight: normal; opacity: 0.7; }

.container { max-width: 1100px; margin: 0 auto; padding: 20px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
.card h2 { font-size: 15px; color: #2e4057; margin-bottom: 14px; border-left: 4px solid #5bc0eb; padding-left: 8px; }

label { font-size: 13px; display: block; margin-bottom: 4px; color: #555; }
input[type=text], input[type=number], select, textarea {
  border: 1px solid #ccc; border-radius: 4px; padding: 6px 10px; font-size: 13px; width: 100%;
}
textarea { resize: vertical; min-height: 100px; font-family: monospace; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #5bc0eb; }

.row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-end; flex-wrap: wrap; }
.field { flex: 1; min-width: 120px; }
.field.sm { flex: 0 0 140px; }

.btn { padding: 8px 18px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; transition: background 0.15s; }
.btn-primary { background: #2e4057; color: #fff; }
.btn-primary:hover { background: #3d5170; }
.btn-success { background: #27ae60; color: #fff; }
.btn-success:hover { background: #219a52; }
.btn-outline { background: transparent; border: 1px solid #2e4057; color: #2e4057; }
.btn-outline:hover { background: #2e4057; color: #fff; }

.actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

/* ドロップゾーン */
.drop-zone {
  border: 2px dashed #aac;
  border-radius: 8px;
  padding: 28px;
  text-align: center;
  color: #668;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.drop-zone:hover, .drop-zone.drag-over { background: #eef4fb; border-color: #5bc0eb; }
.drop-zone .icon { font-size: 32px; margin-bottom: 8px; }
.drop-zone input { display: none; }

/* ファイルバッジ */
.file-badge { display: inline-flex; align-items: center; gap: 6px; background: #e8f4fd; border: 1px solid #5bc0eb; border-radius: 4px; padding: 4px 10px; font-size: 12px; margin-top: 8px; }
.file-badge .remove { cursor: pointer; color: #e74c3c; font-weight: bold; }

/* サマリ出力 */
#summary-section { display: none; }
.status-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.stat-box { flex: 1; min-width: 130px; border-radius: 8px; padding: 14px 16px; text-align: center; }
.stat-box .val { font-size: 26px; font-weight: bold; margin-bottom: 2px; }
.stat-box .lbl { font-size: 12px; opacity: 0.8; }
.stat-ok  { background: #d4efdf; color: #1e8449; }
.stat-ng  { background: #fde8e4; color: #c0392b; }
.stat-total { background: #d6eaf8; color: #1a5276; }
.stat-amt { background: #fef9e7; color: #7d6608; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #2e4057; color: #fff; padding: 8px 10px; text-align: center; white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid #eee; }
tr:hover td { background: #f8f9fb; }
td.num { text-align: right; }
td.center { text-align: center; }
.badge { display: inline-block; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: bold; }
.badge-ok  { background: #d4efdf; color: #1e8449; }
.badge-ng  { background: #fde8e4; color: #c0392b; }
.badge-skip { background: #eee; color: #666; }
tfoot td { font-weight: bold; background: #f0f2f5; }

.hint { font-size: 12px; color: #888; margin-top: 4px; }
.warn { color: #c0392b; font-size: 12px; margin-top: 4px; }
.info-chip { display: inline-block; background: #eef4fb; border: 1px solid #c5dff0; border-radius: 4px; padding: 3px 10px; font-size: 12px; margin-right: 6px; margin-bottom: 4px; }

.section-title { font-size: 13px; font-weight: bold; color: #2e4057; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #eee; }

@media print {
  header, .card:not(#summary-card), .actions { display: none !important; }
  #summary-section { display: block !important; }
  #summary-card { box-shadow: none; }
}
</style>
</head>
<body>

<header>
  POS自動売上計上 RPA実行サマリ
  <span class="sub">メール本文・Excelファイルから自動集計</span>
</header>

<div class="container">

<!-- STEP 1: メール本文 -->
<div class="card">
  <h2>STEP 1 ― RPA実行結果メール本文を貼り付け</h2>
  <div class="field">
    <label>メール本文（テキスト）</label>
    <textarea id="email-body" placeholder="RPAからの実行結果メール本文をここにそのまま貼り付けてください。&#10;実行日時・成功/失敗件数などを自動で抽出します。"></textarea>
  </div>
  <p class="hint">抽出できなかった項目は手動で補完できます。</p>
</div>

<!-- STEP 2: Excelファイル -->
<div class="card">
  <h2>STEP 2 ― Excelファイルをアップロード</h2>
  <div class="row">
    <div class="field">
      <div class="section-title">伝票データ</div>
      <div class="drop-zone" id="dz-slip" onclick="document.getElementById('file-slip').click()">
        <div class="icon">📄</div>
        <div>クリックまたはドラッグ＆ドロップ</div>
        <div style="font-size:12px;margin-top:4px;">.xlsx / .xls</div>
        <input type="file" id="file-slip" accept=".xlsx,.xls">
      </div>
      <div id="badge-slip"></div>
    </div>
    <div class="field">
      <div class="section-title">伝票明細データ</div>
      <div class="drop-zone" id="dz-detail" onclick="document.getElementById('file-detail').click()">
        <div class="icon">📋</div>
        <div>クリックまたはドラッグ＆ドロップ</div>
        <div style="font-size:12px;margin-top:4px;">.xlsx / .xls</div>
        <input type="file" id="file-detail" accept=".xlsx,.xls">
      </div>
      <div id="badge-detail"></div>
    </div>
  </div>
</div>

<!-- STEP 3: 列マッピング -->
<div class="card" id="mapping-card" style="display:none;">
  <h2>STEP 3 ― 列マッピング設定</h2>
  <p class="hint" style="margin-bottom:12px;">Excelの列名が読み込まれました。各項目に対応する列を選択してください。</p>
  <div class="row">
    <div class="field">
      <label>使用するファイル</label>
      <select id="map-source">
        <option value="slip">伝票データ</option>
        <option value="detail">伝票明細データ</option>
      </select>
    </div>
    <div class="field">
      <label>シート名</label>
      <select id="map-sheet"></select>
    </div>
    <div class="field sm">
      <label>ヘッダー行番号</label>
      <input type="number" id="header-row" value="1" min="1" max="10">
    </div>
    <div class="field sm" style="display:flex;align-items:flex-end;">
      <button class="btn btn-outline" onclick="reloadSheetHeaders()">列を再読込</button>
    </div>
  </div>
  <div class="row" id="col-map-row">
    <div class="field">
      <label>店番 列</label>
      <select id="col-store"></select>
    </div>
    <div class="field">
      <label>計上金額 列</label>
      <select id="col-amount"></select>
    </div>
    <div class="field">
      <label>実行結果/ステータス 列（任意）</label>
      <select id="col-status"><option value="">(なし)</option></select>
    </div>
    <div class="field">
      <label>実行日時 列（任意）</label>
      <select id="col-datetime"><option value="">(なし)</option></select>
    </div>
  </div>
  <div id="status-values-row" style="display:none;" class="row">
    <div class="field">
      <label>「成功」とみなす値（カンマ区切り）</label>
      <input type="text" id="ok-values" value="成功,OK,正常,完了,success" placeholder="例: 成功,OK">
    </div>
    <div class="field">
      <label>「失敗」とみなす値（カンマ区切り）</label>
      <input type="text" id="ng-values" value="失敗,NG,エラー,異常,error,fail" placeholder="例: 失敗,NG">
    </div>
  </div>
</div>

<!-- 手動補完 -->
<div class="card" id="manual-card" style="display:none;">
  <h2>STEP 4 ― 補完・確認</h2>
  <div class="row">
    <div class="field">
      <label>実行日時</label>
      <input type="text" id="exec-datetime" placeholder="例: 2026-06-03 02:30:00">
    </div>
    <div class="field">
      <label>対象日付（売上計上日）</label>
      <input type="text" id="target-date" placeholder="例: 2026-06-02">
    </div>
    <div class="field">
      <label>メールの件名（参考）</label>
      <input type="text" id="mail-subject" placeholder="例: 【RPA】POS売上自動計上完了">
    </div>
  </div>
</div>

<div class="actions">
  <button class="btn btn-success" onclick="generateSummary()">サマリを生成</button>
  <button class="btn btn-outline" onclick="resetAll()">リセット</button>
</div>

<!-- サマリ出力 -->
<div id="summary-section">
  <div class="card" id="summary-card">
    <h2>RPA実行サマリ</h2>
    <div id="summary-meta" style="margin-bottom:14px;"></div>
    <div class="status-bar" id="status-bar"></div>
    <div style="overflow-x:auto;">
      <table id="summary-table">
        <thead id="summary-thead"></thead>
        <tbody id="summary-tbody"></tbody>
        <tfoot id="summary-tfoot"></tfoot>
      </table>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="window.print()">印刷 / PDF保存</button>
      <button class="btn btn-outline" onclick="exportCSV()">CSVエクスポート</button>
    </div>
  </div>
</div>

</div><!-- /container -->

<script>
// ========== 状態 ==========
const state = {
  slipWb: null, slipFileName: '',
  detailWb: null, detailFileName: '',
  emailText: '',
};

// ========== ドロップゾーン ==========
function setupDropZone(dzId, fileInputId, wbKey, fileNameKey, badgeId) {
  const dz = document.getElementById(dzId);
  const fi = document.getElementById(fileInputId);

  fi.addEventListener('change', () => { if (fi.files[0]) loadFile(fi.files[0], wbKey, fileNameKey, badgeId); });

  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0], wbKey, fileNameKey, badgeId);
  });
}

function loadFile(file, wbKey, fileNameKey, badgeId) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      state[wbKey] = wb;
      state[fileNameKey] = file.name;
      document.getElementById(badgeId).innerHTML =
        `<span class="file-badge">📎 ${file.name} <span class="remove" onclick="removeFile('${wbKey}','${fileNameKey}','${badgeId}')">✕</span></span>`;
      updateMappingUI();
    } catch(err) {
      alert('ファイルの読み込みに失敗しました: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function removeFile(wbKey, fileNameKey, badgeId) {
  state[wbKey] = null; state[fileNameKey] = '';
  document.getElementById(badgeId).innerHTML = '';
  updateMappingUI();
}

setupDropZone('dz-slip',   'file-slip',   'slipWb',   'slipFileName',   'badge-slip');
setupDropZone('dz-detail', 'file-detail', 'detailWb', 'detailFileName', 'badge-detail');

// ========== マッピング UI ==========
function updateMappingUI() {
  const hasFile = state.slipWb || state.detailWb;
  document.getElementById('mapping-card').style.display = hasFile ? '' : 'none';
  document.getElementById('manual-card').style.display  = hasFile ? '' : 'none';
  if (hasFile) populateSourceOptions();
}

function populateSourceOptions() {
  const src = document.getElementById('map-source');
  src.innerHTML = '';
  if (state.slipWb)   src.insertAdjacentHTML('beforeend', '<option value="slip">伝票データ</option>');
  if (state.detailWb) src.insertAdjacentHTML('beforeend', '<option value="detail">伝票明細データ</option>');
  populateSheets();
}

document.getElementById('map-source').addEventListener('change', populateSheets);

function populateSheets() {
  const src = document.getElementById('map-source').value;
  const wb = src === 'slip' ? state.slipWb : state.detailWb;
  const sel = document.getElementById('map-sheet');
  sel.innerHTML = '';
  if (!wb) return;
  wb.SheetNames.forEach(n => sel.insertAdjacentHTML('beforeend', `<option value="${n}">${n}</option>`));
  reloadSheetHeaders();
}

document.getElementById('map-sheet').addEventListener('change', reloadSheetHeaders);

function reloadSheetHeaders() {
  const src = document.getElementById('map-source').value;
  const wb = src === 'slip' ? state.slipWb : state.detailWb;
  const sheetName = document.getElementById('map-sheet').value;
  const headerRow = parseInt(document.getElementById('header-row').value, 10) - 1;
  if (!wb || !sheetName) return;

  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  const headers = (rows[headerRow] || []).map((h, i) => h !== '' ? String(h) : `列${i+1}`);

  ['col-store','col-amount','col-status','col-datetime'].forEach(id => {
    const sel = document.getElementById(id);
    const prev = sel.value;
    const isOptional = id === 'col-status' || id === 'col-datetime';
    sel.innerHTML = isOptional ? '<option value="">(なし)</option>' : '';
    headers.forEach(h => {
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = h;
      sel.appendChild(opt);
    });
    if (prev && headers.includes(prev)) sel.value = prev;
    else autoGuess(id, headers);
  });

  const hasStatus = document.getElementById('col-status').value !== '';
  document.getElementById('status-values-row').style.display = hasStatus ? '' : 'none';
}

document.getElementById('col-status').addEventListener('change', () => {
  const hasStatus = document.getElementById('col-status').value !== '';
  document.getElementById('status-values-row').style.display = hasStatus ? '' : 'none';
});

function autoGuess(selId, headers) {
  const patterns = {
    'col-store':    [/店番/,/店舗番号/,/店コード/,/store/i,/shop/i],
    'col-amount':   [/金額/,/計上金額/,/売上/,/amount/i,/price/i],
    'col-status':   [/結果/,/ステータス/,/status/i,/result/i,/成否/],
    'col-datetime': [/日時/,/実行日/,/datetime/i,/date/i,/time/i],
  };
  const pats = patterns[selId] || [];
  for (const pat of pats) {
    const found = headers.find(h => pat.test(h));
    if (found) { document.getElementById(selId).value = found; return; }
  }
}

// ========== メール本文パース ==========
function parseEmail(text) {
  const result = { datetime: '', targetDate: '', subject: '' };
  if (!text) return result;

  // 実行日時パターン
  const dtMatch = text.match(/(\d{4}[\/\-年]\d{1,2}[\/\-月]\d{1,2}[日\s　]*\d{1,2}:\d{2}(:\d{2})?)/);
  if (dtMatch) result.datetime = dtMatch[1];

  // 対象日付
  const tdMatch = text.match(/対象[日付期間：:　\s]*(\d{4}[\/\-年]\d{1,2}[\/\-月]\d{1,2})/);
  if (tdMatch) result.targetDate = tdMatch[1];

  return result;
}

// ========== サマリ生成 ==========
function generateSummary() {
  const emailText = document.getElementById('email-body').value;
  const parsed = parseEmail(emailText);

  // 手動入力で上書き
  const execDt    = document.getElementById('exec-datetime').value || parsed.datetime || '不明';
  const targetDt  = document.getElementById('target-date').value   || parsed.targetDate || '';
  const subject   = document.getElementById('mail-subject').value;

  // Excelデータ取得
  const src = document.getElementById('map-source').value;
  const wb  = src === 'slip' ? state.slipWb : state.detailWb;
  if (!wb) { alert('Excelファイルをアップロードしてください。'); return; }

  const sheetName = document.getElementById('map-sheet').value;
  const headerRow = parseInt(document.getElementById('header-row').value, 10) - 1;
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

  const headers = (rows[headerRow] || []).map(h => String(h));
  const dataRows = rows.slice(headerRow + 1).filter(r => r.some(c => c !== ''));

  const colStore    = headers.indexOf(document.getElementById('col-store').value);
  const colAmount   = headers.indexOf(document.getElementById('col-amount').value);
  const colStatus   = document.getElementById('col-status').value   ? headers.indexOf(document.getElementById('col-status').value)   : -1;
  const colDatetime = document.getElementById('col-datetime').value ? headers.indexOf(document.getElementById('col-datetime').value) : -1;

  if (colStore < 0 || colAmount < 0) { alert('店番または計上金額の列が選択されていません。'); return; }

  const okVals = document.getElementById('ok-values').value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
  const ngVals = document.getElementById('ng-values').value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);

  // 集計
  const storeMap = new Map();
  let globalOk = 0, globalNg = 0, globalSkip = 0;

  dataRows.forEach(row => {
    const store  = String(row[colStore] ?? '').trim();
    const rawAmt = row[colAmount];
    const amount = parseFloat(String(rawAmt).replace(/[,，￥¥\s]/g, '')) || 0;
    const statusRaw = colStatus >= 0 ? String(row[colStatus] ?? '').trim() : '';
    const dtRaw     = colDatetime >= 0 ? row[colDatetime] : '';

    let statusLabel = '', statusType = 'skip';
    if (statusRaw) {
      const sl = statusRaw.toLowerCase();
      if (okVals.some(v => sl.includes(v))) { statusLabel = statusRaw; statusType = 'ok'; }
      else if (ngVals.some(v => sl.includes(v))) { statusLabel = statusRaw; statusType = 'ng'; }
      else { statusLabel = statusRaw; statusType = 'skip'; }
    }

    if (!storeMap.has(store)) storeMap.set(store, { store, amount: 0, ok: 0, ng: 0, skip: 0, lastStatus: '', lastDt: '' });
    const entry = storeMap.get(store);
    entry.amount += amount;
    if (statusType === 'ok')   { entry.ok++;   globalOk++; }
    else if (statusType === 'ng') { entry.ng++; globalNg++; }
    else { entry.skip++; globalSkip++; }
    if (statusRaw) entry.lastStatus = statusRaw;
    if (dtRaw) entry.lastDt = formatCell(dtRaw);
  });

  const entries = Array.from(storeMap.values()).sort((a, b) => a.store.localeCompare(b.store, 'ja'));
  const totalAmount = entries.reduce((s, e) => s + e.amount, 0);
  const totalRows   = dataRows.length;

  // メール本文からも成否件数を上書き試行
  const okFromMail  = extractCount(emailText, /成功[件数：:\s]*(\d+)/);
  const ngFromMail  = extractCount(emailText, /失敗[件数：:\s]*(\d+)/);
  const dispOk  = okFromMail  !== null ? okFromMail  : globalOk;
  const dispNg  = ngFromMail  !== null ? ngFromMail  : globalNg;

  // ---- 描画 ----
  const section = document.getElementById('summary-section');
  section.style.display = '';

  // メタ情報
  document.getElementById('summary-meta').innerHTML = [
    execDt   ? `<span class="info-chip">実行日時: ${execDt}</span>` : '',
    targetDt ? `<span class="info-chip">対象日付: ${targetDt}</span>` : '',
    subject  ? `<span class="info-chip">件名: ${subject}</span>` : '',
    `<span class="info-chip">集計行数: ${totalRows}件</span>`,
    `<span class="info-chip">店舗数: ${entries.length}</span>`,
  ].filter(Boolean).join('');

  // ステータスバー
  document.getElementById('status-bar').innerHTML = `
    <div class="stat-box stat-ok">
      <div class="val">${dispOk}</div><div class="lbl">成功</div>
    </div>
    <div class="stat-box stat-ng">
      <div class="val">${dispNg}</div><div class="lbl">失敗</div>
    </div>
    <div class="stat-box stat-total">
      <div class="val">${totalRows}</div><div class="lbl">総件数</div>
    </div>
    <div class="stat-box stat-amt">
      <div class="val">${fmt(totalAmount)}</div><div class="lbl">合計計上金額</div>
    </div>
  `;

  // テーブルヘッダ
  const hasStatusCol   = colStatus >= 0;
  const hasDatetimeCol = colDatetime >= 0;
  let thead = '<tr><th>店番</th><th>計上金額</th>';
  if (hasStatusCol)   thead += '<th>成否</th>';
  if (hasDatetimeCol) thead += '<th>実行日時</th>';
  thead += '</tr>';
  document.getElementById('summary-thead').innerHTML = thead;

  // テーブル本体
  let tbody = '';
  entries.forEach(e => {
    const badge = e.ng > 0
      ? `<span class="badge badge-ng">失敗 ${e.ng}</span>`
      : e.ok > 0
        ? `<span class="badge badge-ok">成功</span>`
        : `<span class="badge badge-skip">${e.lastStatus || '-'}</span>`;
    tbody += `<tr>
      <td>${escHtml(e.store)}</td>
      <td class="num">${fmt(e.amount)}</td>
      ${hasStatusCol ? `<td class="center">${badge}</td>` : ''}
      ${hasDatetimeCol ? `<td class="center">${escHtml(e.lastDt)}</td>` : ''}
    </tr>`;
  });
  document.getElementById('summary-tbody').innerHTML = tbody;

  // フッター
  document.getElementById('summary-tfoot').innerHTML = `<tr>
    <td>合計</td>
    <td class="num">${fmt(totalAmount)}</td>
    ${hasStatusCol ? '<td></td>' : ''}
    ${hasDatetimeCol ? '<td></td>' : ''}
  </tr>`;

  section.scrollIntoView({ behavior: 'smooth' });
}

// ========== CSVエクスポート ==========
function exportCSV() {
  const table = document.getElementById('summary-table');
  if (!table) return;
  let csv = '';
  table.querySelectorAll('tr').forEach(tr => {
    const cells = Array.from(tr.querySelectorAll('th,td')).map(c => `"${c.innerText.replace(/"/g, '""')}"`);
    csv += cells.join(',') + '\r\n';
  });
  const bom = '﻿';
  const blob = new Blob([bom + csv], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const d = new Date(); const ts = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  a.download = `POS_RPA_サマリ_${ts}.csv`; a.click();
}

// ========== ユーティリティ ==========
function fmt(n) { return Math.round(n).toLocaleString('ja-JP') + ' 円'; }
function pad(n) { return String(n).padStart(2,'0'); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function extractCount(text, re) { const m = text.match(re); return m ? parseInt(m[1], 10) : null; }
function formatCell(v) {
  if (v instanceof Date) {
    return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())} ${pad(v.getHours())}:${pad(v.getMinutes())}`;
  }
  return String(v);
}
function resetAll() {
  ['email-body','exec-datetime','target-date','mail-subject'].forEach(id => document.getElementById(id).value = '');
  state.slipWb = null; state.slipFileName = '';
  state.detailWb = null; state.detailFileName = '';
  ['badge-slip','badge-detail'].forEach(id => document.getElementById(id).innerHTML = '');
  document.getElementById('mapping-card').style.display = 'none';
  document.getElementById('manual-card').style.display  = 'none';
  document.getElementById('summary-section').style.display = 'none';
  document.getElementById('file-slip').value = '';
  document.getElementById('file-detail').value = '';
}

// 初期状態でメール本文からSTEP4を更新
document.getElementById('email-body').addEventListener('blur', () => {
  const parsed = parseEmail(document.getElementById('email-body').value);
  if (parsed.datetime  && !document.getElementById('exec-datetime').value) document.getElementById('exec-datetime').value = parsed.datetime;
  if (parsed.targetDate && !document.getElementById('target-date').value)  document.getElementById('target-date').value = parsed.targetDate;
});
</script>
